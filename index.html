<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TrueCard</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/app.css" />

  <meta name="theme-color" content="#111827" />
</head>
<body>
  <header class="app-header">
    <h1>TrueCard</h1>
    <p>Scan. Organize. Value.</p>
  </header>

  <main class="container">
    <section class="dashboard">
      <div class="stat-card">
        <span>Total Cards</span>
        <strong id="totalCards">0</strong>
      </div>

      <div class="stat-card">
        <span>Total Value</span>
        <strong id="totalValue">$0.00</strong>
      </div>
    </section>

    <section class="panel">
      <h2>Add Card</h2>

      <div class="scan-row">
        <button type="button" id="scanFrontButton">Scan Front</button>
        <button type="button" id="scanBackButton">Scan Back</button>
      </div>

      <div class="preview-row">
        <img id="frontPreview" class="image-preview" alt="Front card preview" hidden />
        <img id="backPreview" class="image-preview" alt="Back card preview" hidden />
      </div>

      <form id="cardForm">
        <input id="player" placeholder="Player name" required />
        <input id="year" placeholder="Year" type="number" />
        <input id="setName" placeholder="Set" />
        <input id="manufacturer" placeholder="Manufacturer" />
        <input id="cardNumber" placeholder="Card number" />
        <input id="sport" placeholder="Sport" />
        <input id="currentValue" placeholder="Current value" type="number" step="0.01" />

        <button type="submit">Save Card</button>
      </form>
    </section>

    <section class="panel">
      <h2>Search Collection</h2>
      <input id="searchInput" placeholder="Search by player, year, set, sport..." />
    </section>

    <section class="panel">
      <h2>Collection</h2>
      <div id="cardList" class="card-list"></div>
    </section>
  </main>

  <div id="cameraModal" class="camera-modal">
    <div class="camera-box">
      <video id="cameraVideo" autoplay playsinline></video>

      <div class="camera-actions">
        <button id="captureButton" type="button">Capture</button>
        <button id="closeCameraButton" type="button" class="secondary-btn">Close</button>
      </div>
    </div>
  </div>

  <script src="js/database.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
